[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onex-code-delivery"
version = "1.0.0"
description = "Layer-profile metric, prompt pack v1, and a temporary local capture mimic"
requires-python = ">=3.11"

# Core: the metric, the gate and the reference loaders. Pure numeric — installing
# only this gives you `score`-less but complete metric and provenance code.
dependencies = [
    "numpy==2.1.3",
    "pandas==2.3.3",
    "scipy==1.17.0",
]

[project.optional-dependencies]
# The TEMPORARY local capture in platform_mimic/. Delete this extra with the
# directory once the platform's endpoint records — see TEMPORARY.md.
capture = [
    "torch==2.12.0",
    "transformers==5.9.0",
    "pyarrow==24.0.0",
]
db = [
    "psycopg2-binary==2.9.11",
    "python-dotenv==1.2.2",
]
replay = [
    "requests==2.32.5",
]
test = [
    "pytest==9.0.3",
]

[tool.setuptools]
packages = ["layer_profile", "platform_mimic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
